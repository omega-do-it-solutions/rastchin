name: Desktop packages

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop-integrator/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/package-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.18.1"
  PNPM_VERSION: "11.14.0"

jobs:
  windows:
    name: Windows package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop application
        run: pnpm --filter rastchin-desktop-integrator test
      - name: Verify safety and packaging policy
        run: pnpm --filter rastchin-desktop-integrator verify
      - name: Package without publishing
        run: pnpm --filter rastchin-desktop-integrator package:win
      - name: Verify Windows distributables
        shell: pwsh
        run: |
          $dist = "apps/desktop-integrator/dist"
          $setup = @(Get-ChildItem $dist -Filter 'RastChin-Desktop-Integrator-Setup-*.exe')
          $portable = @(Get-ChildItem $dist -Filter 'RastChin-Desktop-Integrator-Portable-*.exe')
          if ($setup.Count -ne 1) { throw "Expected one Setup EXE, found $($setup.Count)." }
          if ($portable.Count -ne 1) { throw "Expected one Portable EXE, found $($portable.Count)." }
      - name: Upload Windows packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rastchin-desktop-windows
          path: |
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-Setup-*.exe
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-Setup-*.exe.blockmap
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-Portable-*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ad-hoc package
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop application
        run: pnpm --filter rastchin-desktop-integrator test
      - name: Verify safety and packaging policy
        run: pnpm --filter rastchin-desktop-integrator verify
      - name: Package ad-hoc build without publishing
        run: pnpm --filter rastchin-desktop-integrator package:mac
      - name: Verify macOS ad-hoc distributables
        shell: bash
        run: |
          set -euo pipefail
          dist="apps/desktop-integrator/dist"
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.dmg' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.zip' | wc -l | tr -d ' ')" -eq 2

          verified_apps=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -q '^Signature=adhoc$'
            verified_apps=$((verified_apps + 1))
          done < <(find "$dist" -maxdepth 2 -name '*.app' -print0)
          test "$verified_apps" -eq 2

          verified_dmgs=0
          while IFS= read -r -d '' dmg; do
            mount_dir="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg" >/dev/null
            app="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -q '^Signature=adhoc$'
            hdiutil detach "$mount_dir" >/dev/null
            rmdir "$mount_dir"
            verified_dmgs=$((verified_dmgs + 1))
          done < <(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.dmg' -print0)
          test "$verified_dmgs" -eq 2
      - name: Upload macOS ad-hoc packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rastchin-desktop-macos-adhoc
          path: |
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-*-macOS-*.dmg
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-*-macOS-*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop application
        run: pnpm --filter rastchin-desktop-integrator test
      - name: Verify safety and packaging policy
        run: pnpm --filter rastchin-desktop-integrator verify
      - name: Package without publishing
        run: pnpm --filter rastchin-desktop-integrator package:linux
      - name: Verify Linux distributables
        shell: bash
        run: |
          set -euo pipefail
          dist="apps/desktop-integrator/dist"
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-Linux-*.AppImage' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-Linux-*.deb' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-Linux-*.rpm' | wc -l | tr -d ' ')" -eq 2
      - name: Upload Linux packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rastchin-desktop-linux
          path: |
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-*-Linux-*.AppImage
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-*-Linux-*.deb
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-*-Linux-*.rpm
          if-no-files-found: error
          retention-days: 14
