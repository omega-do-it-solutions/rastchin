name: Signed macOS desktop release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-macos-desktop-release
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.1"
  PNPM_VERSION: "11.14.0"

jobs:
  sign-notarize-package:
    name: Sign, notarize, and verify
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Require signing and notarization credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test desktop application
        run: pnpm --filter rastchin-desktop-integrator test
      - name: Verify safety and packaging policy
        run: pnpm --filter rastchin-desktop-integrator verify
      - name: Sign, notarize, and package without publishing
        run: pnpm --filter rastchin-desktop-integrator package:mac:release
      - name: Verify signed and notarized distributables
        shell: bash
        run: |
          set -euo pipefail
          dist="apps/desktop-integrator/dist"
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.dmg' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.zip' | wc -l | tr -d ' ')" -eq 2

          verified_apps=0
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
            spctl --assess --type exec --verbose=2 "$app"
            xcrun stapler validate "$app"
            verified_apps=$((verified_apps + 1))
          done < <(find "$dist" -maxdepth 2 -name '*.app' -print0)
          test "$verified_apps" -eq 2

          verified_dmgs=0
          while IFS= read -r -d '' dmg; do
            mount_dir="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg" >/dev/null
            app="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type exec --verbose=2 "$app"
            xcrun stapler validate "$app"
            hdiutil detach "$mount_dir" >/dev/null
            rmdir "$mount_dir"
            verified_dmgs=$((verified_dmgs + 1))
          done < <(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.dmg' -print0)
          test "$verified_dmgs" -eq 2
      - name: Upload signed packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rastchin-desktop-macos-signed
          path: |
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-*-macOS-*.dmg
            apps/desktop-integrator/dist/RastChin-Desktop-Integrator-*-macOS-*.zip
          if-no-files-found: error
          retention-days: 30
