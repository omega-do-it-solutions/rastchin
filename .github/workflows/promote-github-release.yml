name: Promote product release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Product release track
        required: true
        type: choice
        options:
          - browser
          - vscode
          - desktop
      version:
        description: Exact x.y.z prerelease version to promote
        required: true
        type: string
      distribution_confirmed:
        description: Confirm marketplace upload or desktop distribution approval is complete
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: promote-${{ inputs.track }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.18.1"

jobs:
  promote:
    name: Promote verified prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require main and distribution confirmation
        env:
          DISTRIBUTION_CONFIRMED: ${{ inputs.distribution_confirmed }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release promotion must run from main; received $GITHUB_REF." >&2
            exit 1
          fi
          if [ "$DISTRIBUTION_CONFIRMED" != "true" ]; then
            echo "Confirm marketplace upload or desktop distribution approval before promotion." >&2
            exit 1
          fi
      - name: Check out the reviewed main branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Resolve the product tag
        id: metadata
        env:
          RELEASE_SUMMARY: Promotion validation
        run: node scripts/release-metadata.mjs "${{ inputs.track }}" "${{ inputs.version }}"
      - name: Validate the packaged prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_TAG: ${{ steps.metadata.outputs.prerelease_tag }}
          STABLE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PRERELEASE_TAG")"
          is_draft="$(jq -r '.draft' <<<"$release_json")"
          is_prerelease="$(jq -r '.prerelease' <<<"$release_json")"
          asset_count="$(jq -r '.assets | length' <<<"$release_json")"

          if [ "$is_draft" != "false" ]; then
            echo "Release $PRERELEASE_TAG is still a draft." >&2
            exit 1
          fi
          if [ "$is_prerelease" != "true" ]; then
            echo "Release $PRERELEASE_TAG is not marked as a prerelease." >&2
            exit 1
          fi
          if [ "$asset_count" -eq 0 ]; then
            echo "Release $PRERELEASE_TAG has no verified downloadable assets." >&2
            exit 1
          fi

          if gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            stable_prerelease="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$STABLE_TAG" --jq '.prerelease')"
            if [ "$stable_prerelease" != "false" ]; then
              echo "Existing release $STABLE_TAG is not stable." >&2
              exit 1
            fi
            echo "Release $STABLE_TAG is already stable; no change is needed."
            echo "should_promote=false" >> "$GITHUB_OUTPUT"
          elif git show-ref --verify --quiet "refs/tags/$STABLE_TAG"; then
            echo "Stable tag $STABLE_TAG exists without a release; refusing to overwrite it." >&2
            exit 1
          else
            echo "should_promote=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download and verify prerelease assets
        if: steps.release.outputs.should_promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_TAG: ${{ steps.metadata.outputs.prerelease_tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$PRERELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          for checksum in release-assets/SHA256SUMS-*.txt; do
            test -f "$checksum"
            (cd release-assets && sha256sum --check "$(basename "$checksum")")
          done
          gh release view "$PRERELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > release-notes.md
      - name: Publish the stable product tag without changing Latest
        if: steps.release.outputs.should_promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_TAG: ${{ steps.metadata.outputs.prerelease_tag }}
          STABLE_TAG: ${{ steps.metadata.outputs.tag }}
          STABLE_TITLE: ${{ steps.metadata.outputs.title }}
        run: |
          set -euo pipefail
          target_commit="$(git rev-parse "${PRERELEASE_TAG}^{commit}")"
          if ! [[ "$target_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the prerelease commit for $PRERELEASE_TAG." >&2
            exit 1
          fi

          arguments=(
            "$STABLE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$target_commit"
            --title "$STABLE_TITLE"
            --notes-file release-notes.md
            --latest=false
          )
          while IFS= read -r -d '' asset; do
            arguments+=("$asset")
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)

          gh release create "${arguments[@]}"
      - name: Verify stable product release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          is_prerelease="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.prerelease')"
          if [ "$is_prerelease" != "false" ]; then
            echo "Release $RELEASE_TAG was not promoted." >&2
            exit 1
          fi
          echo "$RELEASE_TAG is stable and remains independent of GitHub's repository-wide Latest pointer."
