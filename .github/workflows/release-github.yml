name: GitHub release

on:
  push:
    branches: [main]
    paths:
      - "apps/browser-extension/manifest.json"
      - "apps/browser-extension/package.json"
      - "apps/vscode-extension/package.json"
      - "apps/desktop-integrator/package.json"
      - "plugins/rastchin-persian/.codex-plugin/plugin.json"
      - "plugins/rastchin-persian/.claude-plugin/plugin.json"
      - "plugins/rastchin-persian/evals/cases.json"
      - ".claude-plugin/marketplace.json"
  workflow_dispatch:
    inputs:
      track:
        description: Product release track
        required: true
        type: choice
        options:
          - browser
          - vscode
          - desktop
          - agent
      version:
        description: Exact x.y.z version from the selected product manifest
        required: true
        type: string
      summary:
        description: User-visible changes for the release notes
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean
      macos_mode:
        description: macOS distribution mode (desktop track only)
        required: true
        default: ad-hoc
        type: choice
        options:
          - ad-hoc
          - signed

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  NODE_VERSION: "24.18.1"
  PNPM_VERSION: "11.14.0"

jobs:
  preflight:
    name: Verify release request
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      should_release: ${{ steps.request.outputs.should_release }}
      track: ${{ steps.request.outputs.track }}
      version: ${{ steps.request.outputs.version }}
      tag: ${{ steps.request.outputs.tag }}
      title: ${{ steps.request.outputs.title }}
      summary: ${{ steps.request.outputs.summary }}
      prerelease: ${{ steps.request.outputs.prerelease }}
      macos_mode: ${{ steps.request.outputs.macos_mode }}
    steps:
      - name: Require the reviewed main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "GitHub releases must run from main; received $GITHUB_REF." >&2
          exit 1
      - name: Check out the exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Resolve manual or automatic release request
        id: request
        env:
          AFTER_SHA: ${{ github.sha }}
          AUTO_MACOS_RELEASE_MODE: ${{ vars.MACOS_RELEASE_MODE || 'ad-hoc' }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_MACOS_RELEASE_MODE: ${{ inputs.macos_mode }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
          MANUAL_SUMMARY: ${{ inputs.summary }}
          MANUAL_TRACK: ${{ inputs.track }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: node scripts/release-request.mjs
      - name: Report a non-release push
        if: steps.request.outputs.should_release != 'true'
        env:
          RELEASE_SKIP_REASON: ${{ steps.request.outputs.reason }}
        run: echo "$RELEASE_SKIP_REASON"
      - name: Install pnpm
        if: steps.request.outputs.should_release == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install frozen dependencies
        if: steps.request.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile
      - name: Run repository release gates
        if: steps.request.outputs.should_release == 'true'
        run: |
          pnpm check
          pnpm audit:prod
          pnpm audit --audit-level high
      - name: Require a new immutable tag
        if: steps.request.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [ -n "$remote_tag" ]; then
            echo "Tag $RELEASE_TAG already exists and will not be moved." >&2
            exit 1
          fi

  browser:
    name: Package browser extensions
    if: needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.track == 'browser'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify Chrome and Firefox ZIPs
        run: pnpm --filter rastchin-browser-extension package:all
      - name: Stage artifacts and checksums
        run: |
          set -euo pipefail
          mkdir release-artifacts
          cp apps/browser-extension/dist/*.zip release-artifacts/
          cd release-artifacts
          sha256sum -- *.zip > SHA256SUMS-browser.txt
      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-browser
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  vscode:
    name: Package VS Code extension
    if: needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.track == 'vscode'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and package VSIX
        run: |
          pnpm --filter rastchin-vscode test
          pnpm --filter rastchin-vscode package
      - name: Stage artifact and checksum
        run: |
          set -euo pipefail
          mkdir release-artifacts
          cp apps/vscode-extension/*.vsix release-artifacts/
          cd release-artifacts
          sha256sum -- *.vsix > SHA256SUMS-vscode.txt
      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-vscode
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  agent:
    name: Package Persian agent plugin
    if: needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.track == 'agent'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify and archive plugin
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          pnpm verify:agent-plugin
          mkdir release-artifacts
          git archive \
            --format=zip \
            --prefix="rastchin-persian-${RELEASE_VERSION}/" \
            --output="release-artifacts/rastchin-persian-${RELEASE_VERSION}.zip" \
            HEAD:plugins/rastchin-persian
          cd release-artifacts
          sha256sum -- *.zip > SHA256SUMS-agent.txt
      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-agent
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Package desktop for Windows
    if: needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.track == 'desktop'
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Test, verify, and package Windows builds
        run: |
          pnpm --filter rastchin-desktop-integrator test
          pnpm --filter rastchin-desktop-integrator verify
          pnpm --filter rastchin-desktop-integrator package:win
      - name: Stage Windows assets and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDirectory = New-Item -ItemType Directory -Path "release-artifacts"
          $setup = @(Get-ChildItem "apps/desktop-integrator/dist" -Filter 'RastChin-Desktop-Integrator-Setup-*.exe')
          $portable = @(Get-ChildItem "apps/desktop-integrator/dist" -Filter 'RastChin-Desktop-Integrator-Portable-*.exe')
          if ($setup.Count -ne 1) { throw "Expected one Setup EXE, found $($setup.Count)." }
          if ($portable.Count -ne 1) { throw "Expected one Portable EXE, found $($portable.Count)." }
          Copy-Item @($setup[0].FullName, $portable[0].FullName) -Destination $releaseDirectory.FullName
          $lines = Get-ChildItem $releaseDirectory.FullName -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksumPath = Join-Path $releaseDirectory.FullName "SHA256SUMS-desktop-windows.txt"
          [IO.File]::WriteAllText($checksumPath, ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Upload verified Windows assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-desktop-windows
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    name: Package desktop for macOS
    if: needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.track == 'desktop'
    needs: preflight
    runs-on: macos-14
    timeout-minutes: 95
    env:
      MACOS_RELEASE_MODE: ${{ needs.preflight.outputs.macos_mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Test and verify macOS builds
        run: |
          set -euo pipefail
          pnpm --filter rastchin-desktop-integrator test
          pnpm --filter rastchin-desktop-integrator verify
      - name: Package ad-hoc macOS builds
        if: env.MACOS_RELEASE_MODE == 'ad-hoc'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm --filter rastchin-desktop-integrator package:mac
      - name: Sign, notarize, and package macOS builds
        if: env.MACOS_RELEASE_MODE == 'signed'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          pnpm --filter rastchin-desktop-integrator package:mac:release
      - name: Verify and stage public macOS assets
        run: |
          set -euo pipefail
          dist="apps/desktop-integrator/dist"
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.dmg' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.zip' | wc -l | tr -d ' ')" -eq 2

          verify_app() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            if [ "$MACOS_RELEASE_MODE" = "signed" ]; then
              codesign --display --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
              spctl --assess --type exec --verbose=2 "$app"
              xcrun stapler validate "$app"
            else
              codesign --display --verbose=4 "$app" 2>&1 | grep -q '^Signature=adhoc$'
            fi
          }

          verified_apps=0
          while IFS= read -r -d '' app; do
            verify_app "$app"
            verified_apps=$((verified_apps + 1))
          done < <(find "$dist" -maxdepth 2 -name '*.app' -print0)
          test "$verified_apps" -eq 2

          verified_dmgs=0
          while IFS= read -r -d '' dmg; do
            mount_dir="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg" >/dev/null
            app="$(find "$mount_dir" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$app"
            verify_app "$app"
            hdiutil detach "$mount_dir" >/dev/null
            rmdir "$mount_dir"
            verified_dmgs=$((verified_dmgs + 1))
          done < <(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-macOS-*.dmg' -print0)
          test "$verified_dmgs" -eq 2

          mkdir release-artifacts
          cp "$dist"/RastChin-Desktop-Integrator-*-macOS-*.dmg release-artifacts/
          cp "$dist"/RastChin-Desktop-Integrator-*-macOS-*.zip release-artifacts/
          cd release-artifacts
          shasum -a 256 -- *.dmg *.zip > SHA256SUMS-desktop-macos.txt
      - name: Upload verified macOS assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-desktop-macos
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: Package desktop for Linux
    if: needs.preflight.outputs.should_release == 'true' && needs.preflight.outputs.track == 'desktop'
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Test, verify, and package Linux builds
        run: |
          pnpm --filter rastchin-desktop-integrator test
          pnpm --filter rastchin-desktop-integrator verify
          pnpm --filter rastchin-desktop-integrator package:linux
      - name: Stage Linux assets and checksum
        run: |
          set -euo pipefail
          dist="apps/desktop-integrator/dist"
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-Linux-*.AppImage' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-Linux-*.deb' | wc -l | tr -d ' ')" -eq 2
          test "$(find "$dist" -maxdepth 1 -name 'RastChin-Desktop-Integrator-*-Linux-*.rpm' | wc -l | tr -d ' ')" -eq 2
          mkdir release-artifacts
          cp "$dist"/RastChin-Desktop-Integrator-*-Linux-*.AppImage release-artifacts/
          cp "$dist"/RastChin-Desktop-Integrator-*-Linux-*.deb release-artifacts/
          cp "$dist"/RastChin-Desktop-Integrator-*-Linux-*.rpm release-artifacts/
          cd release-artifacts
          sha256sum -- *.AppImage *.deb *.rpm > SHA256SUMS-desktop-linux.txt
      - name: Upload verified Linux assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-desktop-linux
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create immutable GitHub Release
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.preflight.outputs.should_release == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      - preflight
      - browser
      - vscode
      - agent
      - desktop-windows
      - desktop-macos
      - desktop-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify downloaded checksums and prepare notes
        env:
          RELEASE_NOTES_PATH: release-notes.md
          RELEASE_SUMMARY: ${{ needs.preflight.outputs.summary }}
          RELEASE_TRACK: ${{ needs.preflight.outputs.track }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MACOS_RELEASE_MODE: ${{ needs.preflight.outputs.macos_mode }}
        run: |
          set -euo pipefail
          test -n "$(find release-artifacts -maxdepth 1 -type f -print -quit)"
          for checksum in release-artifacts/SHA256SUMS-*.txt; do
            test -f "$checksum"
            (cd release-artifacts && sha256sum --check "$(basename "$checksum")")
          done
          node scripts/release-metadata.mjs "$RELEASE_TRACK" "$RELEASE_VERSION"
      - name: Publish GitHub Release and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_TITLE: ${{ needs.preflight.outputs.title }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and will not be replaced." >&2
            exit 1
          fi

          arguments=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_TITLE"
            --notes-file release-notes.md
          )
          if [ "$PRERELEASE" = "true" ]; then
            arguments+=(--prerelease)
          fi
          while IFS= read -r -d '' asset; do
            arguments+=("$asset")
          done < <(find release-artifacts -maxdepth 1 -type f -print0 | sort -z)

          gh release create "${arguments[@]}"
