<style>
@font-face { font-family: Vazirmatn; src: url('/font.ttf'); font-weight: 100 900; }

aside { float: left; width: 160px; }
main { margin-left: 180px; }
article { border-bottom: 1px solid #555; margin-bottom: 1rem; }

[data-d-default-strong] { font-weight: 700; }
[data-markdown-copy="code-block"] { border-radius: 1rem; background: #282828; margin-block: 1rem; overflow: hidden; }
[data-markdown-copy="exclude"] { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; }
[data-markdown-copy="exclude"] .truncate { flex: 1; }
.chatgpt-code-scrollport { overflow: auto; padding: 0 1rem 1rem; }
.chatgpt-code-scrollport code { display: block; white-space: pre; min-width: max-content; }
[data-composer-body] { border: 1px solid #777; border-radius: 1rem; padding: 1rem; }
.ProseMirror { outline: none; white-space: pre-wrap; max-height: 100px; overflow: auto; }
#results { position: sticky; top: 0; z-index: 2; background: #202c2a; white-space: pre-wrap; font: 13px/1.4 monospace; padding: 1rem; max-height: 200px; overflow: auto; }
